; SkyrimNet Physical Diaries — English locale
; Format placeholders: {Day}=weekday, {d}=day number, {Month}=month name, {y}=year, {Name}=NPC name, {n}=volume number

[Format]
DateLong = {Day}, {d} {Month}, 4E {y}
DateShort = {d} {Month}, 4E {y}
DiaryTitle = {Name}'s Diary
VolumeSuffix = , v{n}
EmptyVolumeText = All entries from this time period have been removed.

