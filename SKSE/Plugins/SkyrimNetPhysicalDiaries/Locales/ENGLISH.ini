; SkyrimNet Physical Diaries — English locale
; Format placeholders: {Day}=weekday, {d}=day number, {Month}=month name, {y}=year, {Name}=NPC name, {n}=volume number

[Format]
DateLong = {Day}, {d} {Month}, 4E {y}
DateShort = {d} {Month}, 4E {y}
DiaryTitle = {Name}'s Diary
; The player's own written volumes (writing mode).
JournalTitle = {Name}'s Journal
; The blank journal item (sold and crafted; reading one starts a journal).
BlankJournal = Blank Journal
; The dialogue asking an NPC to write every day, and the one undoing it.
DailyDiaryAsk = Would you keep a diary? Write in it every day.
DailyDiaryStop = You don't need to write in your diary every day anymore.
VolumeSuffix = , v{n}
EmptyVolumeText = All entries from this time period have been removed.

[Months]
Morning Star = Morning Star
Sun's Dawn = Sun's Dawn
First Seed = First Seed
Rain's Hand = Rain's Hand
Second Seed = Second Seed
Midyear = Midyear
Sun's Height = Sun's Height
Last Seed = Last Seed
Hearthfire = Hearthfire
Frostfall = Frostfall
Sun's Dusk = Sun's Dusk
Evening Star = Evening Star

[Days]
Sundas = Sundas
Morndas = Morndas
Tirdas = Tirdas
Middas = Middas
Turdas = Turdas
Fredas = Fredas
Loredas = Loredas

[Messages]
; Startup warnings and prompts. "\n" is a line break.
TemplatesMissing = SkyrimNet Physical Diaries: the diary template books were not found.\n\nDiaries can't be created. Check that:\n - SkyrimNet Physical Diaries.esp is enabled\n - powerofthree's Tweaks or Native EditorID Fix is installed for your game version\n\nSee SkyrimNetPhysicalDiaries.log for details.
; After a load: writing is off (book.swf missing, outdated or overridden) but the save has journals.
WritingOff = Physical Diaries' book menu (interface\book.swf) is missing and writing is disabled. Journals are now read-only. Please check your installation if this was not intentional.
SkyrimNetTooOld = Physical Diaries needs a newer version of SkyrimNet. Diaries and journals are disabled until SkyrimNet is updated.
; Closing your journal with unsaved changes.
EditSavePrompt = Keep the changes to your journal?
EditSave = Save
EditDiscard = Discard
EditKeepWriting = Keep writing
EditSaveFailed = Your journal couldn't be saved. See SkyrimNetPhysicalDiaries.log.
; Tearing out an entry while writing. {Date} is the entry's date.
EditDeletePrompt = Tear out the entry from {Date}?\n\nIt will be gone from your journal and from your memory.
EditDelete = Tear out
EditKeep = Keep it
EditDeleteFailed = The entry couldn't be torn out. See SkyrimNetPhysicalDiaries.log.
; Why writing can't start, and the hint when a save keeps an emptied entry.
EditNeedsSkyrimNet = Writing in your journal needs a newer SkyrimNet.
EditNeedsPause = Writing in your journal needs the book menu to pause the game.
EditEmptiedHint = An emptied entry is kept. To remove an entry, tear it out.
; A blank journal read from your inventory became your journal.
EditStartedVolume = You begin a new journal.
; Reading a blank journal from your inventory begins a journal; this if it fails.
BlankJournalFailed = The journal couldn't be started. See SkyrimNetPhysicalDiaries.log.
; An NPC starts or stops writing every day. {Name} is theirs.
DailyDiaryOn = {Name} will write in their diary every day.
DailyDiaryOff = {Name} will no longer write in their diary every day.
; The new-entry key: no journal, none on you, or no room (a journal holds Entries Per Volume entries).
EditNoJournal = You have no journal. Read a blank journal to begin one.
EditJournalNotCarried = Your journal isn't with you.
EditJournalFull = Your journal is full. Read a blank journal to begin another.
; Writing needs a quill, and each writing session a dip of ink (or blood, below).
EditNeedsQuill = To write in your journal you need a quill and an inkwell.
EditInkRanDry = Your inkwell runs dry.
EditOk = OK
; No ink but a quill: write in blood (10% of health per entry).
EditBloodPrompt = You have no ink. Write in your own blood?
EditBloodYes = Write in blood
EditBloodNo = Put the quill down
EditTooWeak = You're too weak to write in blood.
