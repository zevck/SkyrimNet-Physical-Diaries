[Messages]
; Startup warnings and prompts. "\n" is a line break.
TemplatesMissing = SkyrimNet Physical Diaries: the diary template books were not found.\n\nDiaries can't be created. Check that:\n - SkyrimNet Physical Diaries.esp is enabled\n - powerofthree's Tweaks or Native EditorID Fix is installed for your game version\n\nSee SkyrimNetPhysicalDiaries.log for details.
; After a load: writing is off (Ink & Quill missing or too old, or its writing off) but the save has journals.
WritingOff = Ink & Quill - Writing Framework isn't installed, or its writing is off (see InkAndQuill.log). Your journals are read-only until it's back.
SkyrimNetTooOld = Physical Diaries needs a newer version of SkyrimNet. Diaries and journals are disabled until SkyrimNet is updated.
EditSaveFailed = Your journal couldn't be saved. See SkyrimNetPhysicalDiaries.log.
; Tearing out an entry while writing. {Date} is the entry's date.
EditDeletePrompt = Tear out the entry from {Date}?\n\nIt will be gone from your journal and from your memory.
EditDelete = Tear out
EditKeep = Keep it
EditDeleteFailed = The entry couldn't be torn out. See SkyrimNetPhysicalDiaries.log.
; Why writing can't start, and the hint when a save keeps an emptied entry.
EditNeedsSkyrimNet = Writing in your journal needs a newer SkyrimNet.
EditEmptiedHint = An emptied entry is kept. To remove an entry, tear it out.
; A blank journal read from your inventory became your journal.
EditStartedVolume = You begin a new journal.
; After a load: a journal made after the save, whose entries SkyrimNet kept, is back in your inventory.
JournalRestored = You still have your journal.
; Reading a blank journal from your inventory begins a journal; this if it fails.
BlankJournalFailed = The journal couldn't be started. See SkyrimNetPhysicalDiaries.log.
; An NPC starts or stops writing every day. {Name} is theirs.
DailyDiaryOn = {Name} will write in their diary every day.
DailyDiaryOff = {Name} will no longer write in their diary every day.
; The new-entry key: no journal, none on you, or no room (a journal holds Entries Per Volume entries).
EditNoJournal = You have no journal. Read a blank journal to begin one.
EditJournalNotCarried = Your journal isn't with you.
EditJournalFull = Your journal is full. Read a blank journal to begin another.
