[Messages]
; Startup warnings and prompts. "\n" is a line break.
TemplatesMissing = SkyrimNet Physical Diaries: the diary template books were not found.\n\nDiaries can't be created. Check that:\n - SkyrimNet Physical Diaries.esp is enabled\n - powerofthree's Tweaks or Native EditorID Fix is installed for your game version\n\nSee SkyrimNetPhysicalDiaries.log for details.
; Closing your diary with unsaved changes.
EditSavePrompt = Keep the changes to your diary?
EditSave = Save
EditDiscard = Discard
EditKeepWriting = Keep writing
EditSaveFailed = Your diary couldn't be saved. See SkyrimNetPhysicalDiaries.log.
; Tearing out an entry while writing. {Date} is the entry's date.
EditDeletePrompt = Tear out the entry from {Date}?\n\nIt will be gone from your diary and from your memory.
EditDelete = Tear out
EditKeep = Keep it
EditDeleteFailed = The entry couldn't be torn out. See SkyrimNetPhysicalDiaries.log.
; Why writing can't start, and the hint when a save keeps an emptied entry.
EditNeedsSkyrimNet = Writing in your diary needs a newer SkyrimNet.
EditNeedsPause = Writing in your diary needs the book menu to pause the game.
EditEmptiedHint = An emptied entry is kept. To remove an entry, tear it out.
; New entries: only in the latest volume; a full one starts the next volume.
EditNotLatest = New entries go in your latest diary.
EditNewVolume = This diary is full. You begin a new one.
; The new-entry key during play, with no diary or without the latest volume on you.
EditStartedVolume = You begin a new diary.
