; SkyrimNet Physical Diaries — Russian locale

[Format]
DateLong = {Day}, {d} день месяца {Month}, 4Э {y}
DateShort = {d} день месяца {Month}, 4Э {y}
DiaryTitle = Дневник: {Name}
; The player's own written volumes (writing mode).
JournalTitle = Записки: {Name}
; The blank journal item (sold and crafted; reading one starts a journal).
BlankJournal = Чистая тетрадь
VolumeSuffix = , т. {n}
EmptyVolumeText = Все записи за этот период были удалены.

