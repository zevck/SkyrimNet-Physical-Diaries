[Messages]
; Startup warnings. "\n" is a line break.
TemplatesMissing = SkyrimNet Physical Diaries: шаблоны книг дневников не найдены.\n\nДневники не могут быть созданы. Проверьте, что:\n - SkyrimNet Physical Diaries.esp включён\n - powerofthree's Tweaks или Native EditorID Fix установлен для вашей версии игры\n\nПодробности в SkyrimNetPhysicalDiaries.log.
WritingOff = Ink & Quill - Writing Framework не установлен, или письмо в нём отключено (см. InkAndQuill.log). Ваши записки доступны только для чтения, пока он не вернётся.
SkyrimNetTooOld = Physical Diaries требуется более новая версия SkyrimNet. Дневники и записки отключены до обновления SkyrimNet.
EditSaveFailed = Не удалось сохранить записки. См. SkyrimNetPhysicalDiaries.log.
EditDeletePrompt = Вырвать запись от {Date}?\n\nОна исчезнет из ваших записок и из вашей памяти.
EditDelete = Вырвать
EditKeep = Оставить
EditDeleteFailed = Не удалось вырвать запись. См. SkyrimNetPhysicalDiaries.log.
EditNeedsSkyrimNet = Для письма в записках нужна более новая версия SkyrimNet.
EditEmptiedHint = Опустошённая запись сохраняется. Чтобы убрать запись, вырвите её.
EditStartedVolume = Вы начинаете новые записки.
; After a load: a journal made after the save, whose entries SkyrimNet kept, is back in your inventory.
JournalRestored = Ваши записки всё ещё при вас.
; Reading a blank journal from your inventory begins a journal; this if it fails.
BlankJournalFailed = Не удалось начать записки. См. SkyrimNetPhysicalDiaries.log.
DailyDiaryOn = {Name} будет писать в дневник каждый день.
DailyDiaryOff = {Name} больше не будет писать в дневник каждый день.
; The new-entry key during play, with no journal or without it on you.
EditNoJournal = У вас нет записок. Прочтите чистую тетрадь, чтобы начать их.
EditJournalNotCarried = Ваших записок нет при вас.
EditJournalFull = Эти записки заполнены. Прочтите чистую тетрадь, чтобы начать новые.
