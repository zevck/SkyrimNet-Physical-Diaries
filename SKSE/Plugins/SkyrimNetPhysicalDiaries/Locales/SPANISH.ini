; SkyrimNet Physical Diaries — Spanish locale

[Format]
DateLong = {Day}, {d} de {Month}, 4E {y}
DateShort = {d} de {Month}, 4E {y}
DiaryTitle = Diario de {Name}
; The player's own written volumes (writing mode).
JournalTitle = Cuaderno de {Name}
; The blank journal item (sold and crafted; reading one starts a journal).
BlankJournal = Cuaderno en blanco
VolumeSuffix = , vol. {n}
EmptyVolumeText = Todas las entradas de este periodo han sido eliminadas.

