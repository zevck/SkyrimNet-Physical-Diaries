[Messages]
; Startup warnings. "\n" is a line break.
TemplatesMissing = SkyrimNet Physical Diaries: no se encontraron los libros plantilla de los diarios.\n\nNo se pueden crear diarios. Comprueba que:\n - SkyrimNet Physical Diaries.esp está activado\n - powerofthree's Tweaks o Native EditorID Fix está instalado para tu versión del juego\n\nConsulta SkyrimNetPhysicalDiaries.log para más detalles.
WritingOff = Ink & Quill - Writing Framework no está instalado, o su escritura está desactivada (ver InkAndQuill.log). Tus cuadernos son de solo lectura hasta que vuelva.
SkyrimNetTooOld = Physical Diaries necesita una versión más reciente de SkyrimNet. Los diarios y los cuadernos están desactivados hasta que se actualice SkyrimNet.
EditSaveFailed = No se pudo guardar tu cuaderno. Consulta SkyrimNetPhysicalDiaries.log.
EditDeletePrompt = ¿Arrancar la entrada del {Date}?\n\nDesaparecerá de tu cuaderno y de tu memoria.
EditDelete = Arrancar
EditKeep = Conservarla
EditDeleteFailed = No se pudo arrancar la entrada. Consulta SkyrimNetPhysicalDiaries.log.
EditNeedsSkyrimNet = Escribir en tu cuaderno requiere una versión más reciente de SkyrimNet.
EditEmptiedHint = Una entrada vaciada se conserva. Para quitar una entrada, arráncala.
EditStartedVolume = Empiezas un nuevo cuaderno.
; After a load: a journal made after the save, whose entries SkyrimNet kept, is back in your inventory.
JournalRestored = Todavía tienes tu cuaderno.
; Reading a blank journal from your inventory begins a journal; this if it fails.
BlankJournalFailed = No se pudo empezar el cuaderno. Consulta SkyrimNetPhysicalDiaries.log.
DailyDiaryOn = {Name} escribirá en su diario cada día.
DailyDiaryOff = {Name} ya no escribirá en su diario cada día.
; The new-entry key during play, with no journal or without it on you.
EditNoJournal = No tienes cuaderno. Lee un cuaderno en blanco para empezar uno.
EditJournalNotCarried = No llevas tu cuaderno encima.
EditJournalFull = Tu cuaderno está lleno. Lee un cuaderno en blanco para empezar otro.
