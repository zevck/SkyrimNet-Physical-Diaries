[Messages]
; Startup warnings. "\n" is a line break.
TemplatesMissing = SkyrimNet Physical Diaries: nie znaleziono szablonów książek dzienników.\n\nNie można tworzyć dzienników. Sprawdź, czy:\n - SkyrimNet Physical Diaries.esp jest włączony\n - powerofthree's Tweaks lub Native EditorID Fix jest zainstalowany dla Twojej wersji gry\n\nSzczegóły znajdziesz w SkyrimNetPhysicalDiaries.log.
WritingOff = Brakuje menu książki Physical Diaries (interface\book.swf), więc pisanie jest wyłączone. Notatniki są teraz tylko do odczytu. Jeśli to niezamierzone, sprawdź instalację.
EditSavePrompt = Zachować zmiany w notatniku?
EditSave = Zapisz
EditDiscard = Odrzuć
EditKeepWriting = Pisz dalej
EditSaveFailed = Nie udało się zapisać notatnika. Zobacz SkyrimNetPhysicalDiaries.log.
EditDeletePrompt = Wyrwać wpis z {Date}?\n\nZniknie z twojego notatnika i z twojej pamięci.
EditDelete = Wyrwij
EditKeep = Zostaw
EditDeleteFailed = Nie udało się wyrwać wpisu. Zobacz SkyrimNetPhysicalDiaries.log.
EditNeedsSkyrimNet = Pisanie w notatniku wymaga nowszej wersji SkyrimNet.
EditNeedsPause = Pisanie w notatniku wymaga, by menu książki wstrzymywało grę.
EditEmptiedHint = Opróżniony wpis zostaje zachowany. Aby usunąć wpis, wyrwij go.
EditStartedVolume = Zaczynasz nowy notatnik.
; Reading a blank journal from your inventory begins a journal; this if it fails.
BlankJournalFailed = Nie udało się zacząć notatnika. Zobacz SkyrimNetPhysicalDiaries.log.
; The new-entry key during play, with no journal or without it on you.
EditNoJournal = Nie masz notatnika. Przeczytaj pusty notatnik, aby go zacząć.
EditJournalNotCarried = Nie masz przy sobie notatnika.
EditJournalFull = Twój notatnik jest pełny. Przeczytaj pusty notatnik, aby zacząć kolejny.
