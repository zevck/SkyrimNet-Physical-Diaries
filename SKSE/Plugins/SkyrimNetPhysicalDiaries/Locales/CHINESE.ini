; SkyrimNet Physical Diaries — Traditional Chinese locale
; {cn} = Chinese numeral for volume number

[Format]
DateLong = {Month}第{d}天，第四紀元 {y}年，{Day}
DateShort = {Month}第{d}天，第四紀元 {y}年
DiaryTitle = {Name}的日記
; The player's own written volumes (writing mode).
JournalTitle = {Name}的手記
; The blank journal item (sold and crafted; reading one starts a journal).
BlankJournal = 空白手記
VolumeSuffix = ，卷{cn}
EmptyVolumeText = 此時期的所有條目已被刪除。

[Months]
Morning Star = 晨星月
Sun's Dawn = 日曙月
First Seed = 初種月
Rain's Hand = 雨手月
Second Seed = 次種月
Midyear = 年中月
Sun's Height = 日高月
Last Seed = 末種月
Hearthfire = 爐火月
Frostfall = 霜落月
Sun's Dusk = 日暮月
Evening Star = 夜星月

[Days]
Sundas = 週日
Morndas = 週一
Tirdas = 週二
Middas = 週三
Turdas = 週四
Fredas = 週五
Loredas = 週六

[Messages]
; Startup warnings. "\n" is a line break.
TemplatesMissing = SkyrimNet Physical Diaries：找不到日記的範本書籍。\n\n無法建立日記。請確認：\n - SkyrimNet Physical Diaries.esp 已啟用\n - 已安裝適用於您遊戲版本的 powerofthree's Tweaks 或 Native EditorID Fix\n\n詳情請參閱 SkyrimNetPhysicalDiaries.log。
WritingOff = Physical Diaries 的書本選單（interface\book.swf）遺失，書寫已停用。手記現在為唯讀。若非有意為之，請檢查你的安裝。
; Reading a blank journal from your inventory begins a journal; this if it fails.
BlankJournalFailed = 無法開始手記。請參閱 SkyrimNetPhysicalDiaries.log。
; The new-entry key during play, with no journal or without it on you.
EditNoJournal = 你沒有手記。閱讀一本空白手記來開始寫。
EditJournalNotCarried = 你的手記不在身上。
EditJournalFull = 你的手記已經寫滿了。閱讀一本空白手記來開始新的一本。
; Writing needs a quill, and each writing session a dip of ink (or blood, below).
EditNeedsQuill = 要寫手記，你需要羽毛筆和墨水瓶。
EditInkRanDry = 你的墨水瓶乾了。
EditOk = 確定
; No ink but a quill: write in blood (10% of health per entry).
EditBloodPrompt = 你沒有墨水了。要用自己的血來寫嗎？
EditBloodYes = 用血書寫
EditBloodNo = 放下羽毛筆
EditTooWeak = 你太虛弱了，無法用血書寫。
