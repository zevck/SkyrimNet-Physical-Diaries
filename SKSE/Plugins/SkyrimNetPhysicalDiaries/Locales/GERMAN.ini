; SkyrimNet Physical Diaries — German locale

[Format]
DateLong = {Day}, {d} {Month}, 4E {y}
DateShort = {d} {Month}, 4E {y}
DiaryTitle = {Name}s Tagebuch
; The player's own written volumes (writing mode).
JournalTitle = {Name}s Journal
; The blank journal item (sold and crafted; reading one starts a journal).
BlankJournal = Leeres Journal
DailyDiaryAsk = Würdet Ihr ein Tagebuch führen? Schreibt jeden Tag hinein.
DailyDiaryStop = Ihr müsst nicht mehr jeden Tag in Euer Tagebuch schreiben.
VolumeSuffix = , Buch {n}
EmptyVolumeText = Alle Einträge aus diesem Zeitraum wurden entfernt.

