[Messages]
; Startup warnings. "\n" is a line break.
TemplatesMissing = SkyrimNet Physical Diaries: Die Vorlagen für die Tagebücher wurden nicht gefunden.\n\nEs können keine Tagebücher erstellt werden. Prüfe, ob:\n - SkyrimNet Physical Diaries.esp aktiviert ist\n - powerofthree's Tweaks oder Native EditorID Fix für deine Spielversion installiert ist\n\nDetails stehen in SkyrimNetPhysicalDiaries.log.
WritingOff = Das Buchmenü von Physical Diaries (interface\book.swf) fehlt, und das Schreiben ist deaktiviert. Journale sind jetzt schreibgeschützt. Bitte prüfen Sie Ihre Installation, falls das nicht beabsichtigt war.
EditSavePrompt = Die Änderungen an Ihrem Journal behalten?
EditSave = Speichern
EditDiscard = Verwerfen
EditKeepWriting = Weiterschreiben
EditSaveFailed = Ihr Journal konnte nicht gespeichert werden. Siehe SkyrimNetPhysicalDiaries.log.
EditDeletePrompt = Den Eintrag vom {Date} herausreißen?\n\nEr verschwindet aus Ihrem Journal und aus Ihrer Erinnerung.
EditDelete = Herausreißen
EditKeep = Behalten
EditDeleteFailed = Der Eintrag konnte nicht herausgerissen werden. Siehe SkyrimNetPhysicalDiaries.log.
EditNeedsSkyrimNet = Zum Schreiben in Ihr Journal wird eine neuere SkyrimNet-Version benötigt.
EditNeedsPause = Zum Schreiben in Ihr Journal muss das Buchmenü das Spiel pausieren.
EditEmptiedHint = Ein geleerter Eintrag bleibt erhalten. Um einen Eintrag zu entfernen, reißen Sie ihn heraus.
EditStartedVolume = Sie beginnen ein neues Journal.
; Reading a blank journal from your inventory begins a journal; this if it fails.
BlankJournalFailed = Das Journal konnte nicht begonnen werden. Siehe SkyrimNetPhysicalDiaries.log.
DailyDiaryOn = {Name} schreibt nun jeden Tag Tagebuch.
DailyDiaryOff = {Name} schreibt nicht mehr jeden Tag Tagebuch.
; The new-entry key during play, with no journal or without it on you.
EditNoJournal = Sie haben kein Journal. Lesen Sie ein leeres Journal, um eines zu beginnen.
EditJournalNotCarried = Ihr Journal ist nicht bei Ihnen.
EditJournalFull = Ihr Journal ist voll. Lesen Sie ein leeres Journal, um ein neues zu beginnen.
; Writing needs a quill, and each writing session a dip of ink (or blood, below).
EditNeedsQuill = Um in Ihr Journal zu schreiben, brauchen Sie eine Schreibfeder und ein Tintenfass.
EditInkRanDry = Ihr Tintenfass ist leer.
EditOk = OK
; No ink but a quill: write in blood (10% of health per entry).
EditBloodPrompt = Sie haben keine Tinte mehr. Mit Ihrem eigenen Blut schreiben?
EditBloodYes = Mit Blut schreiben
EditBloodNo = Die Feder weglegen
EditTooWeak = Sie sind zu schwach, um mit Blut zu schreiben.
