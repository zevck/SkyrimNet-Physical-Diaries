[Messages]
; Startup warnings. "\n" is a line break.
TemplatesMissing = SkyrimNet Physical Diaries : les livres modèles des journaux sont introuvables.\n\nAucun journal ne peut être créé. Vérifiez que :\n - SkyrimNet Physical Diaries.esp est activé\n - powerofthree's Tweaks ou Native EditorID Fix est installé pour votre version du jeu\n\nConsultez SkyrimNetPhysicalDiaries.log pour plus de détails.
WritingOff = Ink & Quill - Writing Framework n'est pas installé, ou son écriture est désactivée (voir InkAndQuill.log). Vos carnets sont en lecture seule jusqu'à son retour.
SkyrimNetTooOld = Physical Diaries nécessite une version plus récente de SkyrimNet. Les journaux et les carnets sont désactivés jusqu'à la mise à jour de SkyrimNet.
EditSaveFailed = Votre carnet n'a pas pu être enregistré. Voir SkyrimNetPhysicalDiaries.log.
EditDeletePrompt = Arracher l'entrée du {Date} ?\n\nElle disparaîtra de votre carnet et de votre mémoire.
EditDelete = Arracher
EditKeep = La garder
EditDeleteFailed = L'entrée n'a pas pu être arrachée. Voir SkyrimNetPhysicalDiaries.log.
EditNeedsSkyrimNet = Écrire dans votre carnet nécessite une version plus récente de SkyrimNet.
EditEmptiedHint = Une entrée vidée est conservée. Pour supprimer une entrée, arrachez-la.
EditStartedVolume = Vous commencez un nouveau carnet.
; After a load: a journal made after the save, whose entries SkyrimNet kept, is back in your inventory.
JournalRestored = Vous avez toujours votre carnet.
; Reading a blank journal from your inventory begins a journal; this if it fails.
BlankJournalFailed = Le carnet n'a pas pu être commencé. Voir SkyrimNetPhysicalDiaries.log.
DailyDiaryOn = {Name} écrira dans son journal chaque jour.
DailyDiaryOff = {Name} n'écrira plus dans son journal chaque jour.
; The new-entry key during play, with no journal or without it on you.
EditNoJournal = Vous n'avez pas de carnet. Lisez un carnet vierge pour en commencer un.
EditJournalNotCarried = Votre carnet n'est pas sur vous.
EditJournalFull = Votre carnet est plein. Lisez un carnet vierge pour en commencer un autre.
