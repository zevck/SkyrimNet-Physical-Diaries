; SkyrimNet Physical Diaries — French locale

[Format]
DateLong = {Day}, {d} {Month}, 4E {y}
DateShort = {d} {Month}, 4E {y}
DiaryTitle = Journal de {Name}
; The player's own written volumes (writing mode).
JournalTitle = Carnet de {Name}
; The blank journal item (sold and crafted; reading one starts a journal).
BlankJournal = Carnet vierge
VolumeSuffix = , vol. {n}
EmptyVolumeText = Toutes les entrées de cette période ont été supprimées.

