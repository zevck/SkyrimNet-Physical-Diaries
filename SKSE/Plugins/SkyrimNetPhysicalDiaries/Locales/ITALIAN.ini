[Messages]
; Startup warnings. "\n" is a line break.
TemplatesMissing = SkyrimNet Physical Diaries: i libri modello dei diari non sono stati trovati.\n\nNon è possibile creare i diari. Controlla che:\n - SkyrimNet Physical Diaries.esp sia attivo\n - powerofthree's Tweaks o Native EditorID Fix sia installato per la tua versione del gioco\n\nPer i dettagli consulta SkyrimNetPhysicalDiaries.log.
WritingOff = Il menu dei libri di Physical Diaries (interface\book.swf) manca e la scrittura è disattivata. I taccuini ora sono di sola lettura. Controlla l'installazione se non è voluto.
SkyrimNetTooOld = Physical Diaries richiede una versione più recente di SkyrimNet. I diari e i taccuini sono disattivati finché SkyrimNet non viene aggiornato.
EditSavePrompt = Mantenere le modifiche al taccuino?
EditSave = Salva
EditDiscard = Scarta
EditKeepWriting = Continua a scrivere
EditSaveFailed = Non è stato possibile salvare il taccuino. Vedi SkyrimNetPhysicalDiaries.log.
EditDeletePrompt = Strappare la voce del {Date}?\n\nSparirà dal tuo taccuino e dalla tua memoria.
EditDelete = Strappa
EditKeep = Tienila
EditDeleteFailed = Non è stato possibile strappare la voce. Vedi SkyrimNetPhysicalDiaries.log.
EditNeedsSkyrimNet = Per scrivere nel taccuino serve una versione più recente di SkyrimNet.
EditNeedsPause = Per scrivere nel taccuino il menu dei libri deve mettere in pausa il gioco.
EditEmptiedHint = Una voce svuotata viene mantenuta. Per rimuovere una voce, strappala.
EditStartedVolume = Inizi un nuovo taccuino.
; Reading a blank journal from your inventory begins a journal; this if it fails.
BlankJournalFailed = Impossibile iniziare il taccuino. Vedi SkyrimNetPhysicalDiaries.log.
DailyDiaryOn = {Name} scriverà nel diario ogni giorno.
DailyDiaryOff = {Name} non scriverà più nel diario ogni giorno.
; The new-entry key during play, with no journal or without it on you.
EditNoJournal = Non hai un taccuino. Leggi un taccuino vuoto per iniziarne uno.
EditJournalNotCarried = Non hai con te il tuo taccuino.
EditJournalFull = Il tuo taccuino è pieno. Leggi un taccuino vuoto per iniziarne un altro.
; Writing needs a quill, and each writing session a dip of ink (or blood, below).
EditNeedsQuill = Per scrivere nel tuo taccuino ti servono un calamo e un calamaio.
EditInkRanDry = Il tuo calamaio è asciutto.
EditOk = OK
; No ink but a quill: write in blood (10% of health per entry).
EditBloodPrompt = Non hai più inchiostro. Scrivere con il tuo sangue?
EditBloodYes = Scrivi col sangue
EditBloodNo = Posa il calamo
EditTooWeak = Sei troppo debole per scrivere col sangue.
