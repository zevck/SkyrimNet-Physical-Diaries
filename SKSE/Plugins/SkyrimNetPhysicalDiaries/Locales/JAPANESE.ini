; SkyrimNet Physical Diaries — Japanese locale

[Format]
DateLong = 第四紀{y}年 {Month}{d}日 {Day}
DateShort = 第四紀{y}年 {Month}{d}日
DiaryTitle = {Name}の日記
; The player's own written volumes (writing mode).
JournalTitle = {Name}の手記
; The blank journal item (sold and crafted; reading one starts a journal).
BlankJournal = 白紙の手記
DailyDiaryAsk = 日記をつけてくれないか？毎日書いてほしい。
DailyDiaryStop = もう毎日日記を書かなくていい。
VolumeSuffix =  第{n}巻
EmptyVolumeText = この期間のすべての記事は削除されました。

