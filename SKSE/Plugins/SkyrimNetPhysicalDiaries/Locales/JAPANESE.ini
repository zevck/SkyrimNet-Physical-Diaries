[Messages]
; Startup warnings. "\n" is a line break.
TemplatesMissing = SkyrimNet Physical Diaries: 日記のテンプレート本が見つかりません。\n\n日記を作成できません。次を確認してください:\n - SkyrimNet Physical Diaries.esp が有効になっている\n - お使いのゲームバージョン用の powerofthree's Tweaks または Native EditorID Fix がインストールされている\n\n詳細は SkyrimNetPhysicalDiaries.log を参照してください。
WritingOff = Physical Diaries のブックメニュー（interface\book.swf）が見つからないため、書き込みは無効です。手記は読み取り専用になりました。意図したものでなければ、インストールを確認してください。
EditSavePrompt = 手記への変更を保存しますか？
EditSave = 保存
EditDiscard = 破棄
EditKeepWriting = 書き続ける
EditSaveFailed = 手記を保存できませんでした。SkyrimNetPhysicalDiaries.log を参照してください。
EditDeletePrompt = {Date} の記事を破り取りますか？\n\n手記からも、あなたの記憶からも消えます。
EditDelete = 破り取る
EditKeep = 残す
EditDeleteFailed = 記事を破り取れませんでした。SkyrimNetPhysicalDiaries.log を参照してください。
EditNeedsSkyrimNet = 手記に書き込むには、より新しい SkyrimNet が必要です。
EditNeedsPause = 手記に書き込むには、ブックメニューがゲームを一時停止する必要があります。
EditEmptiedHint = 空にした記事は残ります。記事を削除するには、破り取ってください。
EditStartedVolume = 新しい手記を始めました。
; Reading a blank journal from your inventory begins a journal; this if it fails.
BlankJournalFailed = 手記を始められませんでした。SkyrimNetPhysicalDiaries.log を確認してください。
DailyDiaryOn = {Name}は毎日日記を書くようになった。
DailyDiaryOff = {Name}は毎日日記を書くのをやめた。
; The new-entry key during play, with no journal or without it on you.
EditNoJournal = 手記を持っていません。白紙の手記を読んで始めてください。
EditJournalNotCarried = 手記が手元にありません。
EditJournalFull = 手記はいっぱいです。白紙の手記を読んで新しい手記を始めてください。
; Writing needs a quill, and each writing session a dip of ink (or blood, below).
EditNeedsQuill = 手記を書くには羽ペンとインク瓶が必要です。
EditInkRanDry = インク瓶が空になった。
EditOk = OK
; No ink but a quill: write in blood (10% of health per entry).
EditBloodPrompt = インクがありません。自分の血で書きますか？
EditBloodYes = 血で書く
EditBloodNo = 羽ペンを置く
EditTooWeak = 血で書くには体が弱りすぎている。
