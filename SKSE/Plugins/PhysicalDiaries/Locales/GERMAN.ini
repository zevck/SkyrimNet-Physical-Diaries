[Messages]
; Startup warnings. "\n" is a line break.
TemplatesMissing = Physical Diaries: Die Vorlagen für die Tagebücher wurden nicht gefunden.\n\nEs können keine Tagebücher erstellt werden. Prüfe, ob:\n - Physical Diaries.esp aktiviert ist\n - powerofthree's Tweaks oder Native EditorID Fix für deine Spielversion installiert ist\n\nDetails stehen in PhysicalDiaries.log.
OldFiles = Physical Diaries: Dateien aus Version 1 sind noch installiert (SkyrimNet Physical Diaries.esp oder SkyrimNetPhysicalDiaries.dll).\n\nVersion 2 hat sie in Physical Diaries.esp und PhysicalDiaries.dll umbenannt. Entferne die alten: Bis dahin funktioniert Physical Diaries nicht richtig.
WritingOff = Ink & Quill - Writing Framework ist nicht installiert, oder sein Schreiben ist deaktiviert (siehe InkAndQuill.log). Ihre Journale sind schreibgeschützt, bis es wieder da ist.
SkyrimNetTooOld = Physical Diaries benötigt eine neuere Version von SkyrimNet. Tagebücher und Journale sind deaktiviert, bis SkyrimNet aktualisiert wird.
EditSaveFailed = Ihr Journal konnte nicht gespeichert werden. Siehe PhysicalDiaries.log.
EditDeletePrompt = Den Eintrag vom {Date} herausreißen?\n\nEr verschwindet aus Ihrem Journal und aus Ihrer Erinnerung.
EditDelete = Herausreißen
EditKeep = Behalten
EditDeleteFailed = Der Eintrag konnte nicht herausgerissen werden. Siehe PhysicalDiaries.log.
EditNeedsSkyrimNet = Zum Schreiben in Ihr Journal wird eine neuere SkyrimNet-Version benötigt.
EditEmptiedHint = Ein geleerter Eintrag bleibt erhalten. Um einen Eintrag zu entfernen, reißen Sie ihn heraus.
EditStartedVolume = Sie beginnen ein neues Journal.
; After a load: a journal made after the save, whose entries SkyrimNet kept, is back in your inventory.
JournalRestored = Sie haben Ihr Journal noch.
; Reading a blank journal from your inventory begins a journal; this if it fails.
BlankJournalFailed = Das Journal konnte nicht begonnen werden. Siehe PhysicalDiaries.log.
DailyDiaryOn = {Name} schreibt nun jeden Tag Tagebuch.
DailyDiaryOff = {Name} schreibt nicht mehr jeden Tag Tagebuch.
; The new-entry key in an open journal that is full (a journal holds Entries Per Volume entries).
EditJournalFull = Ihr Journal ist voll. Lesen Sie ein leeres Journal, um ein neues zu beginnen.
