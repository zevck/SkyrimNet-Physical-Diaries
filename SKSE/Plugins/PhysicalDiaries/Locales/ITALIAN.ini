Rain's Hand = Mano della Pioggia
Second Seed = Secondo Seme
Midyear = Metà Annata
Sun's Height = Luce del Cielo
Last Seed = Ultimo Seme
Hearthfire = Focolare
Frostfall = Gelata
Sun's Dusk = Luce del Crepuscolo
Evening Star = Stella della Sera

