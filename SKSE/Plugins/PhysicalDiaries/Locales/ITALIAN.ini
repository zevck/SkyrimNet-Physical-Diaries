[Messages]
; Startup warnings. "\n" is a line break.
TemplatesMissing = Physical Diaries\n\nI libri modello dei diari non sono stati trovati.\n\nNon è possibile creare i diari. Controlla che:\n - Physical Diaries.esp sia attivo\n - powerofthree's Tweaks o Native EditorID Fix sia installato per la tua versione del gioco\n\nPer i dettagli consulta PhysicalDiaries.log.
OldFiles = Physical Diaries\n\nSono ancora installati file della versione 1 (SkyrimNet Physical Diaries.esp o SkyrimNetPhysicalDiaries.dll).\n\nLa versione 2 li ha rinominati Physical Diaries.esp e PhysicalDiaries.dll. Rimuovi i vecchi file prima di continuare.
WritingOff = Ink & Quill - Writing Framework non è installato, oppure la sua scrittura è disattivata (vedi InkAndQuill.log). I tuoi taccuini sono di sola lettura finché non torna.
SkyrimNetTooOld = Physical Diaries richiede una versione più recente di SkyrimNet. I diari e i taccuini sono disattivati finché SkyrimNet non viene aggiornato.
EditSaveFailed = Non è stato possibile salvare il taccuino. Vedi PhysicalDiaries.log.
EditDeletePrompt = Strappare la voce del {Date}?\n\nSparirà dal tuo taccuino e dalla tua memoria.
EditDelete = Strappa
EditKeep = Tienila
EditDeleteFailed = Non è stato possibile strappare la voce. Vedi PhysicalDiaries.log.
EditNeedsSkyrimNet = Per scrivere nel taccuino serve una versione più recente di SkyrimNet.
EditEmptiedHint = Una voce svuotata viene mantenuta. Per rimuovere una voce, strappala.
EditStartedVolume = Inizi un nuovo taccuino.
; After a load: a journal made after the save, whose entries SkyrimNet kept, is back in your inventory.
JournalRestored = Hai ancora il tuo taccuino.
; Reading a blank journal from your inventory begins a journal; this if it fails.
BlankJournalFailed = Impossibile iniziare il taccuino. Vedi PhysicalDiaries.log.
DailyDiaryOn = {Name} scriverà nel diario ogni giorno.
DailyDiaryOff = {Name} non scriverà più nel diario ogni giorno.
; The new-entry key in an open journal that is full (a journal holds Entries Per Volume entries).
EditJournalFull = Il tuo taccuino è pieno. Leggi un taccuino vuoto per iniziarne un altro.
