; SkyrimNet Physical Diaries — Italian locale

[Format]
DateLong = {Day}, {d} {Month}, 4E {y}
DateShort = {d} {Month}, 4E {y}
DiaryTitle = Diario di {Name}
; The player's own written volumes (writing mode).
JournalTitle = Taccuino di {Name}
; The blank journal item (sold and crafted; reading one starts a journal).
BlankJournal = Taccuino vuoto
VolumeSuffix =  - Vol. {n}
EmptyVolumeText = Tutte le voci di questo periodo sono state rimosse.

[Months]
Morning Star = Stella del Mattino
Sun's Dawn = Luce dell'Alba
