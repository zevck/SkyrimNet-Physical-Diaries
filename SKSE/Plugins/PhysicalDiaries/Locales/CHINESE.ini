; SkyrimNet Physical Diaries — Traditional Chinese locale
; {cn} = Chinese numeral for volume number

[Format]
DateLong = {Month}第{d}天，第四紀元 {y}年，{Day}
DateShort = {Month}第{d}天，第四紀元 {y}年
DiaryTitle = {Name}的日記
; The player's own written volumes (writing mode).
JournalTitle = {Name}的手記
; The blank journal item (sold and crafted; reading one starts a journal).
BlankJournal = 空白手記
VolumeSuffix = ，卷{cn}
EmptyVolumeText = 此時期的所有條目已被刪除。

[Months]
Morning Star = 晨星月
Sun's Dawn = 日曙月
First Seed = 初種月
Rain's Hand = 雨手月
Second Seed = 次種月
Midyear = 年中月
Sun's Height = 日高月
Last Seed = 末種月
Hearthfire = 爐火月
Frostfall = 霜落月
Sun's Dusk = 日暮月
Evening Star = 夜星月

[Days]
Sundas = 週日
Morndas = 週一
Tirdas = 週二
Middas = 週三
Turdas = 週四
Fredas = 週五
Loredas = 週六

[Messages]
; Startup warnings. "\n" is a line break.
TemplatesMissing = Physical Diaries\n\n找不到日記的範本書籍。\n\n無法建立日記。請確認：\n - Physical Diaries.esp 已啟用\n - 已安裝適用於您遊戲版本的 powerofthree's Tweaks 或 Native EditorID Fix\n\n詳情請參閱 PhysicalDiaries.log。
OldFiles = Physical Diaries\n\n仍安裝著版本 1 的檔案（SkyrimNet Physical Diaries.esp 或 SkyrimNetPhysicalDiaries.dll）。\n\n版本 2 已將它們改名為 Physical Diaries.esp 與 PhysicalDiaries.dll。繼續之前請先移除舊檔案。
WritingOff = 未安裝 Ink & Quill - Writing Framework，或其書寫功能已停用（請參閱 InkAndQuill.log）。在它恢復之前，你的手記為唯讀。
SkyrimNetTooOld = Physical Diaries 需要較新版本的 SkyrimNet。在更新 SkyrimNet 之前，日記與手記將停用。
EditSaveFailed = 無法儲存你的手記。請見 PhysicalDiaries.log。
EditDeletePrompt = 要撕下 {Date} 的條目嗎？\n\n它會從你的手記和你的記憶中消失。
EditDelete = 撕下
EditKeep = 保留
EditDeleteFailed = 無法撕下該條目。請見 PhysicalDiaries.log。
EditNeedsSkyrimNet = 在手記中書寫需要較新版本的 SkyrimNet。
EditEmptiedHint = 清空的條目會被保留。要移除條目，請將它撕下。
EditStartedVolume = 你開始了一本新的手記。
; After a load: a journal made after the save, whose entries SkyrimNet kept, is back in your inventory.
JournalRestored = 你的手記仍在身上。
; Reading a blank journal from your inventory begins a journal; this if it fails.
BlankJournalFailed = 無法開始手記。請參閱 PhysicalDiaries.log。
DailyDiaryOn = {Name}會每天寫日記。
DailyDiaryOff = {Name}不再每天寫日記。
; The new-entry key in an open journal that is full (a journal holds Entries Per Volume entries).
EditJournalFull = 你的手記已經寫滿了。閱讀一本空白手記來開始新的一本。
