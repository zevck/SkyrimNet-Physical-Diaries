[Messages]
; Startup warnings. "\n" is a line break.
TemplatesMissing = Physical Diaries\n\nNie znaleziono szablonów książek dzienników.\n\nNie można tworzyć dzienników. Sprawdź, czy:\n - Physical Diaries.esp jest włączony\n - powerofthree's Tweaks lub Native EditorID Fix jest zainstalowany dla Twojej wersji gry\n\nSzczegóły znajdziesz w PhysicalDiaries.log.
OldFiles = Physical Diaries\n\nPliki z wersji 1 są nadal zainstalowane (SkyrimNet Physical Diaries.esp lub SkyrimNetPhysicalDiaries.dll).\n\nWersja 2 zmieniła ich nazwy na Physical Diaries.esp i PhysicalDiaries.dll. Usuń stare pliki, zanim zaczniesz grać dalej.
WritingOff = Ink & Quill - Writing Framework nie jest zainstalowany albo jego pisanie jest wyłączone (zob. InkAndQuill.log). Twoje notatniki są tylko do odczytu, dopóki nie wróci.
SkyrimNetTooOld = Physical Diaries wymaga nowszej wersji SkyrimNet. Dzienniki i notatniki są wyłączone do czasu aktualizacji SkyrimNet.
EditSaveFailed = Nie udało się zapisać notatnika. Zobacz PhysicalDiaries.log.
EditDeletePrompt = Wyrwać wpis z {Date}?\n\nZniknie z twojego notatnika i z twojej pamięci.
EditDelete = Wyrwij
EditKeep = Zostaw
EditDeleteFailed = Nie udało się wyrwać wpisu. Zobacz PhysicalDiaries.log.
EditNeedsSkyrimNet = Pisanie w notatniku wymaga nowszej wersji SkyrimNet.
EditEmptiedHint = Opróżniony wpis zostaje zachowany. Aby usunąć wpis, wyrwij go.
EditStartedVolume = Zaczynasz nowy notatnik.
; After a load: a journal made after the save, whose entries SkyrimNet kept, is back in your inventory.
JournalRestored = Wciąż masz swój notatnik.
; Reading a blank journal from your inventory begins a journal; this if it fails.
BlankJournalFailed = Nie udało się zacząć notatnika. Zobacz PhysicalDiaries.log.
DailyDiaryOn = {Name} będzie codziennie pisać w dzienniku.
DailyDiaryOff = {Name} nie będzie już codziennie pisać w dzienniku.
; The new-entry key in an open journal that is full (a journal holds Entries Per Volume entries).
EditJournalFull = Twój notatnik jest pełny. Przeczytaj pusty notatnik, aby zacząć kolejny.
